name: Build & Test

on:
  pull_request:
    branches:
      - main

jobs:
  check-infra-diff:
    name: Check infra diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialise Terraform
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=gymshark-saddiqs1/terraform.tfstate" \
            -backend-config="region=eu-west-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Check infra diff
        working-directory: infra
        run: terraform plan -input=false -var="image_tag=pull-request"

  test-code:
    name: Test Go code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Test Go code
        run: cd backend && go test ./...

  integration-test:
    name: Test DynamoDB integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Start DynamoDB Local
        run: docker compose up -d dynamodb

      - name: Wait for DynamoDB Local
        run: |
          for attempt in {1..30}; do
            if curl --silent http://127.0.0.1:8000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker compose logs dynamodb
          exit 1

      - name: Test DynamoDB integration
        working-directory: backend
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
        run: go test -tags=integration ./internal/packsizes

      - name: Show DynamoDB logs on failure
        if: failure()
        run: docker compose logs dynamodb

  build-artifact:
    name: Build artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build docker image
        run: docker build --platform linux/arm64 -t gymshark-saddiqs1 .
