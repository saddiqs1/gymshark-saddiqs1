name: Deploy

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-west-1

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy infra & image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialise Terraform
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=gymshark-saddiqs1/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Ensure ECR repository exists
        working-directory: infra
        run: |
          terraform apply -auto-approve -input=false \
            -var="image_tag=$IMAGE_TAG" \
            -target=aws_ecr_repository.app \
            -target=aws_ecr_lifecycle_policy.app

      - name: Read ECR repository URL
        working-directory: infra
        run: echo "ECR_REPOSITORY=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate docker tag & set it in env
        run: echo "IMAGE_TAG=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Build and push docker image
        run: |
          docker build -t gymshark-saddiqs1 .
          docker tag gymshark-saddiqs1 "$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Apply Terraform
        working-directory: infra
        run: terraform apply -auto-approve -input=false -var="image_tag=$IMAGE_TAG"
